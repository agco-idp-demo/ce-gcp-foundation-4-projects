name: "tf-pull-request"
on:
  pull_request:
    branches:
      - "test"
      - "staging"
      - "production"

jobs:
  run:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Validate promotion diff
        run: |
          set -euo pipefail
          echo "Validating PR ${{ github.head_ref }} -> ${{ github.base_ref }}"
          find . -mindepth 3 -maxdepth 3 -name terraform.tfvars | sort
